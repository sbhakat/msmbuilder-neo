[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "Cython>=3.0.10",
    "numpy>=2.0",
    "scipy>=1.11",
]

[project]
name = "msmbuilder-neo"
dynamic = ["version"]
description = "Statistical models for biomolecular dynamics: featurization, tICA, clustering, Markov state models and HMMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-2.1-or-later" }
authors = [{ name = "MSMBuilder Neo contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib",
    "pandas>=1.5",
    "mdtraj>=1.10",
    "tables>=3.8",
    "fastcluster",
    "jinja2",
    "pyyaml",
    "tqdm",
    "numpydoc",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist", "numdifftools", "hmmlearn", "statsmodels"]
# Bayesian rate-matrix sampling needs pyhmc, which is not maintained on PyPI.
# Install it separately: pip install git+https://github.com/bojunliu0818/pyhmc.git

[project.scripts]
msmb = "msmbuilder.scripts.msmb:main"

[project.urls]
Source = "https://github.com/sbhakat/msmbuilder-neo"
"Original project" = "https://github.com/msmbuilder/msmbuilder"

[tool.meson-python.args]
install = ["--tags=runtime,python-runtime"]

[tool.pytest.ini_options]
testpaths = ["msmbuilder/tests"]
addopts = "--import-mode=importlib"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
# uv creates the build environments, so no virtualenv download is needed.
build-frontend = "build[uv]"
skip = "*-musllinux_* *-win* *-manylinux_i686"
# Run the full suite on the oldest and newest Python only; it downloads the
# example datasets and takes several minutes per wheel.
test-skip = "cp311-* cp312-*"
test-extras = ["test"]
test-command = "python {project}/msmbuilder/tests/data_init.py && pytest --pyargs msmbuilder.tests -x -q -n auto -p no:cacheprovider"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["*.pyx"]
# Cython files are not valid Python; lint only .py files for now.
extend-exclude = ["*.pyx", "docs", "msmbuilder/project_templates"]

[tool.ruff.lint]
# Start narrow: real errors (pyflakes, syntax) and Python 3 modernisation.
# Style rules can be added once the codebase is formatted.
select = ["E9", "F", "UP", "B", "W605"]
ignore = [
    "B006",   # mutable default arguments: review case by case later
    "B008",   # function calls in defaults
    "B028",   # warnings without stacklevel
    "B905",   # zip() without strict=
    "UP031",  # %-formatting -> f-strings: cosmetic, large diff
    "UP032",  # .format() -> f-strings: cosmetic, large diff
    "F403",   # star imports in __init__ files are intentional
    "F405",
    # Follow-ups: clean these up module by module, then remove them here.
    "F401",   # unused imports (some are public re-exports)
    "F841",   # unused local variables
    "B007",   # unused loop variables
    "B904",   # raise ... from err inside except
    "B027",   # empty method in abstract base class
]

[tool.ruff.lint.per-file-ignores]
"msmbuilder/tests/*" = ["B011", "B015", "B018"]

[tool.mypy]
python_version = "3.10"
files = ["msmbuilder"]
exclude = ["msmbuilder/tests/", "msmbuilder/project_templates/"]
# The codebase has no type hints yet. Start lenient so mypy only reports
# definite errors, then tighten per module as annotations are added.
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Command classes override base-class attributes such as `description` (a
# method on the base class) with plain strings; cmdline.App checks callable()
# at runtime. That dynamic pattern is intentional, so skip this check here.
module = ["msmbuilder.commands.*"]
disable_error_code = ["assignment"]
