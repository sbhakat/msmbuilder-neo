name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the sdist and the wheel,
# checks them, tests the wheel, and uploads both to PyPI with trusted
# publishing (no API token: PyPI trusts this workflow in the `pypi`
# environment). Running the workflow by hand uploads to TestPyPI instead.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          ls -l dist
      - name: Check the package metadata
        run: python -m twine check --strict dist/*
      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          case "$wheel" in
            *"-${tag}-py3-none-any.whl") echo "version $tag OK" ;;
            *) echo "::error::release tag $GITHUB_REF_NAME does not match $wheel"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # only for msmbuilder/tests/data_init.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel and test it
        run: |
          python -m pip install "$(ls dist/*.whl)[test]"
          mkdir -p "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          python "$GITHUB_WORKSPACE/msmbuilder/tests/data_init.py"
          python -m pytest --pyargs msmbuilder.tests -q -n auto -p no:cacheprovider
          msmb -h > /dev/null

  publish-pypi:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/msmbuilder-neo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/msmbuilder-neo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
