name: Docs

# Build the documentation, executing every example notebook, on pull requests
# and pushes to main; publish it to GitHub Pages from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # version.py records the git revision
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MSMBuilder Neo with the docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: Cache example datasets
        uses: actions/cache@v4
        with:
          path: ~/msmbuilder_data
          key: msmbuilder-data-docs-v1
      - name: Download example datasets
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from msmbuilder.example_datasets import AlanineDipeptide, FsPeptide, MetEnkephalin
          for d in (AlanineDipeptide(), FsPeptide(), MetEnkephalin()):
              d.cache()
          PY
      - name: Build the documentation (runs every notebook)
        working-directory: docs
        env:
          MSMB_DOCS_EXECUTE: force
          PYDEVD_DISABLE_FILE_VALIDATION: "1"
        run: python -m sphinx -b html --keep-going -j 1 . _build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
