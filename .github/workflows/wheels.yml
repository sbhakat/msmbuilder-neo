name: Build and test wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # Linux x86_64
          - os: ubuntu-24.04-arm     # Linux aarch64
          - os: macos-15-intel       # macOS Intel
            deployment_target: "15.0"
          - os: macos-15             # macOS Apple Silicon
            deployment_target: "15.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.py records the git revision

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          PREFIX=$(brew --prefix libomp)
          # Homebrew's libomp is built for the runner's macOS version, so the
          # wheel targets that version too.
          echo "CIBW_ENVIRONMENT_MACOS=MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }} CPPFLAGS=-I$PREFIX/include LDFLAGS=-L$PREFIX/lib" >> "$GITHUB_ENV"

      - name: Cache example datasets
        uses: actions/cache@v4
        with:
          path: ~/msmbuilder_data
          key: msmbuilder-data-v1

      - uses: pypa/cibuildwheel@v2.23.3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
