{% set name = "msmbuilder-neo" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/msmbuilder_neo-{{ version }}.tar.gz
  sha256: c6a59c592d4c9d50fdb1f9970e040d474c295c09fe654e0bdb8b16bf1edd320a

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - msmb = msmbuilder.scripts.msmb:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - meson-python >=0.17
    - meson >=1.4
    - ninja
  run:
    - python >={{ python_min }}
    - numpy >=1.24
    - scipy >=1.11
    - scikit-learn >=1.3
    - joblib
    - pandas >=1.5
    - mdtraj >=1.10
    - numba >=0.60
    - h5py >=3.8
    - fastcluster
    - jinja2
    - pyyaml
    - tqdm
    - numpydoc

test:
  requires:
    - python {{ python_min }}
    - pip
    # conda-forge's mdtraj declares netcdf4 in its Python metadata but does not
    # depend on it, which makes `pip check` fail; netcdf4 is not needed by us
    - netcdf4
  imports:
    - msmbuilder
    - msmbuilder.msm
    - msmbuilder.decomposition
    - msmbuilder.cluster
    - msmbuilder.featurizer
    - msmbuilder.lumping
  commands:
    - pip check
    - msmb -h

about:
  home: https://github.com/sbhakat/msmbuilder-neo
  summary: 'Statistical models for biomolecular dynamics: featurization, tICA, VAMP, clustering, Markov state models and HMMs'
  description: |
    MSMBuilder Neo is a modernized fork of MSMBuilder (via msmbuilder2022):
    featurization of molecular dynamics simulations, tICA and VAMP,
    clustering, Markov state models, hidden Markov models, transition path
    theory, PCCA+ macrostates and reproducible YAML pipelines. It is
    imported as `msmbuilder` and provides the `msmb` command.
  license: LGPL-2.1-or-later
  license_file: LICENSE
  doc_url: https://sbhakat.github.io/msmbuilder-neo/
  dev_url: https://github.com/sbhakat/msmbuilder-neo

extra:
  recipe-maintainers:
    - sbhakat
